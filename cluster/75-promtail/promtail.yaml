---
# Promtail DaemonSet shipping pod logs to in-cluster Loki. Once Loki has the
# logs, VPS Grafana queries via the LoadBalancer IP.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: promtail
  namespace: kube-system
spec:
  chart: promtail
  repo: https://grafana.github.io/helm-charts
  targetNamespace: monitoring
  createNamespace: false
  valuesContent: |-
    config:
      clients:
        - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
      snippets:
        # Drop debug noise from kube-system pods (kube-flannel, etc.)
        pipelineStages:
          - match:
              selector: '{namespace="kube-system"} |~ "(?i)debug|trace"'
              action: drop
    daemonset:
      enabled: true
    tolerations:
      - operator: Exists
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 200m, memory: 128Mi }
---
# Loki LoadBalancer Service for VPS Grafana to query.
apiVersion: v1
kind: Service
metadata:
  name: loki-external
  namespace: monitoring
  annotations:
    metallb.universe.tf/loadBalancerIPs: "10.0.0.204"
    metallb.io/address-pool: pool-10-0-0
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http-metrics
