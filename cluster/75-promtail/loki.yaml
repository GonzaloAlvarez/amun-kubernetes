---
# Loki — single-binary mode, filesystem storage on Longhorn. 24h retention.
# VPS Grafana queries it via LoadBalancer IP (10.0.0.204) over the existing
# tailnet route (no cluster→tailnet egress needed).
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: loki
  namespace: kube-system
spec:
  chart: loki
  repo: https://grafana.github.io/helm-charts
  targetNamespace: monitoring
  createNamespace: false
  valuesContent: |-
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig: { replication_factor: 1 }
      schemaConfig:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index: { prefix: index_, period: 24h }
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      limits_config:
        retention_period: 24h
        ingestion_rate_mb: 16
        ingestion_burst_size_mb: 32
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: longhorn
        size: 10Gi
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: 800m, memory: 512Mi }
    monitoring:
      lokiCanary: { enabled: false }
      selfMonitoring: { enabled: false, grafanaAgent: { installOperator: false } }
    test: { enabled: false }
    chunksCache: { enabled: false }
    resultsCache: { enabled: false }
    gateway: { enabled: false }
    # Service: cluster-internal Promtail → loki:3100. We expose externally via
    # a separate LoadBalancer Service to keep the chart's defaults clean.
