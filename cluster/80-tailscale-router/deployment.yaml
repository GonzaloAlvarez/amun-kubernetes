---
# Single Tailscale subnet router pod for the cluster. Advertises the cluster's
# MetalLB pool (10.0.0.192/27) onto the tailnet so VPS Traefik (and any
# tailnet-connected admin client) can reach `<svc>.lab.gn.al` services routed
# through ingress-nginx (10.0.0.201). Future cn-* services don't need their
# own Tailscale identity — they inherit this route.
#
# Pinned to rpid8 with `hostNetwork: true` because:
#   1. Pod-local IP would NAT the route advertisement (Tailscale's userspace
#      mode handles this but with a measurable performance hit + no kernel TUN).
#   2. Pinning prevents two routers from competing for the same advertised
#      subnet during upgrade rolls.
#   3. rpid8 is a compute-only worker (no Longhorn replicas) — moving it
#      doesn't disturb storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-router
  namespace: kube-system
  labels: { app: tailscale-router }
spec:
  replicas: 1
  selector:
    matchLabels: { app: tailscale-router }
  strategy: { type: Recreate }   # only one router at a time; no rolling
  template:
    metadata:
      labels: { app: tailscale-router }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: rpid8
      tolerations:
        - operator: Exists
      serviceAccountName: tailscale-router
      initContainers:
        # Clamp MSS to fit Tailscale's 1280 MTU so VPS→cluster TLS + large
        # bodies don't black-hole on PMTU discovery.
        - name: mss-clamp
          image: alpine:3.20
          securityContext:
            privileged: true
            capabilities: { add: [NET_ADMIN, NET_RAW] }
          command:
            - sh
            - -c
            - |
              apk add --no-cache iptables >/dev/null
              iptables -t mangle -C FORWARD -p tcp -m tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null \
                || iptables -t mangle -A FORWARD -p tcp -m tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
              echo "MSS clamp installed"
      containers:
        - name: tailscale
          image: tailscale/tailscale:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities: { add: [NET_ADMIN, NET_RAW] }
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-router-auth
                  key: TS_AUTHKEY
            - name: TS_HOSTNAME
              value: k8s-router
            - name: TS_EXTRA_ARGS
              value: "--login-server=https://hs.gn.al --accept-routes=false"
            - name: TS_ROUTES
              value: "10.0.0.192/27"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_KUBE_SECRET
              value: "tailscale"   # state goes to Secret in kube-system; RBAC below grants access
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
          volumeMounts:
            - name: state
              mountPath: /var/lib/tailscale
            - name: dev-tun
              mountPath: /dev/net/tun
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:
            exec:
              command: ["tailscale", "status", "--peers=false"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["tailscale", "status", "--peers=false"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: state
          hostPath:
            path: /var/lib/tailscale-router
            type: DirectoryOrCreate
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-router
  namespace: kube-system
---
# RBAC for the Tailscale containerboot's k8s state-store + Events writer.
# Containerboot defaults to a Secret named "tailscale" in its own namespace
# for tailnet state (machine key, node key, derp peers). Grant get/update
# on that one Secret + create/patch on Events in kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-router
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [tailscale]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]   # first-run creation; once created, resourceName scoping kicks in
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-router
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: tailscale-router
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale-router
