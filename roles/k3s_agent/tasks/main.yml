---
- name: Check if k3s agent is already at the desired version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_agent_version
  failed_when: false
  changed_when: false

- name: Read cluster token from local cache
  ansible.builtin.set_fact:
    k3s_token: "{{ lookup('file', k3s_token_path) }}"

- name: Wait for an apiserver
  ansible.builtin.wait_for:
    host: "{{ k3s_init_host }}"
    port: 6443
    timeout: 180
  delegate_to: localhost
  become: false

- name: Install k3s agent
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL {{ k3s_install_url }} | \
      INSTALL_K3S_VERSION='{{ k3s_version }}' \
      K3S_TOKEN='{{ k3s_token }}' \
      K3S_URL='https://{{ k3s_init_host }}:6443' \
      INSTALL_K3S_EXEC='agent {{ k3s_agent_extra_args }}' \
      sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s-agent
  when: (k3s_agent_version.rc != 0) or (k3s_version.split('+')[0] not in (k3s_agent_version.stdout | default('')))

- name: Ensure k3s-agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
