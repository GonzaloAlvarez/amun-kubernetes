---
- name: Read cluster token (written by init)
  ansible.builtin.set_fact:
    k3s_token: "{{ lookup('file', k3s_token_path) }}"

- name: Wait for init server API
  ansible.builtin.wait_for:
    host: "{{ k3s_init_host }}"
    port: 6443
    timeout: 120
  delegate_to: localhost
  become: false

- name: Install k3s server (joining existing cluster)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL {{ k3s_install_url }} | \
      INSTALL_K3S_VERSION='{{ k3s_version }}' \
      K3S_TOKEN='{{ k3s_token }}' \
      K3S_URL='https://{{ k3s_init_host }}:6443' \
      INSTALL_K3S_EXEC='server --server https://{{ k3s_init_host }}:6443 {{ k3s_server_extra_args }}' \
      sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s

- name: Ensure k3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
