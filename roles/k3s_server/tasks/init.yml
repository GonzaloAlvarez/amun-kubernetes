---
- name: Generate cluster token (once on init host)
  ansible.builtin.set_fact:
    k3s_token: "{{ lookup('password', k3s_token_path + ' length=64 chars=ascii_letters,digits') }}"
  run_once: true

- name: Persist token locally for join hosts
  ansible.builtin.copy:
    dest: "{{ k3s_token_path }}"
    content: "{{ k3s_token }}"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Install k3s server (cluster-init)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL {{ k3s_install_url }} | \
      INSTALL_K3S_VERSION='{{ k3s_version }}' \
      K3S_TOKEN='{{ k3s_token }}' \
      INSTALL_K3S_EXEC='server --cluster-init {{ k3s_server_extra_args }}' \
      sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s

- name: Ensure k3s service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
